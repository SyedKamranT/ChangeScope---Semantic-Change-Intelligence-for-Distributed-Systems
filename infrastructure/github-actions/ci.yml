name: ChangeScope Quality & CI Invariants

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Linting & Static Typing Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python Dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Verification
        run: uv run ruff format --check .

      - name: Run Mypy Static Type Analysis
        run: uv run mypy packages/ apps/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend TypeScript Build & Strict Verification
        run: pnpm --filter @changescope/web build

  test-backend:
    name: Automated Unit & Contract Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python Dependencies
        run: uv pip install -e ".[dev]"

      - name: Execute Pytest Suite
        run: uv run pytest -v tests/ --cov=packages --cov=apps

  docker-build-verification:
    name: Container Build Dry-Run
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false

      - name: Build API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Build Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
